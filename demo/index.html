<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarberPro — Démo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap');

  :root{
    --bg:#0A0A0B; --surface:#131316; --surface2:#1B1B20;
    --line:rgba(255,255,255,.075); --line2:rgba(200,169,106,.28);
    --gold:#C8A96A; --gold2:#E6CFA0; --ink:#0E0D0B;
    --text:#F1EEE7; --muted:#908D86;
    --green:#7FB98F; --orange:#D9A05B; --red:#C97B6E;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{
    font-family:var(--sans); font-weight:300; color:var(--text);
    background:
      radial-gradient(900px 420px at 50% -8%, rgba(200,169,106,.10), transparent 65%),
      radial-gradient(700px 500px at 90% 110%, rgba(200,169,106,.05), transparent 60%),
      var(--bg);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:26px 12px 48px;
  }

  /* ── En-tête de page ── */
  .wordmark{font-family:var(--serif); font-size:30px; font-weight:600; letter-spacing:.04em; margin:0;}
  .wordmark em{color:var(--gold); font-style:italic;}
  .page-sub{
    color:var(--muted); font-size:11px; letter-spacing:.32em; text-transform:uppercase;
    margin:6px 0 20px; text-align:center;
  }
  .roles{
    display:flex; background:rgba(255,255,255,.04); border:1px solid var(--line);
    border-radius:999px; padding:4px; margin-bottom:22px; backdrop-filter:blur(6px);
  }
  .roles button{
    background:transparent; border:none; color:var(--muted); font-family:var(--sans);
    font-size:12.5px; font-weight:500; letter-spacing:.06em; padding:8px 22px;
    border-radius:999px; cursor:pointer; transition:all .25s;
  }
  .roles button.on{background:var(--gold); color:var(--ink); font-weight:600;}

  /* ── Téléphone ── */
  .phone{
    width:392px; max-width:100%; height:800px; background:var(--bg);
    border:1px solid rgba(255,255,255,.10); border-radius:44px; overflow:hidden;
    display:flex; flex-direction:column; position:relative;
    box-shadow:0 0 0 6px rgba(0,0,0,.55), 0 40px 90px rgba(0,0,0,.65);
  }
  @media (max-width:480px){
    body{padding:10px 0 0;}
    .phone{height:calc(100vh - 140px); border-radius:28px;}
  }
  .screen{flex:1; overflow-y:auto; padding:26px 20px 30px; scrollbar-width:none;}
  .screen::-webkit-scrollbar{display:none;}
  .fade{animation:fadeUp .35s ease both;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

  /* ── Barre d'onglets ── */
  .tabbar{
    display:flex; background:rgba(14,14,16,.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--line); padding:6px 4px 12px;
  }
  .tabbar button{
    flex:1; background:none; border:none; color:#6E6B65; padding:8px 0 0;
    font-family:var(--sans); font-size:9.5px; font-weight:500; letter-spacing:.08em;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px;
    transition:color .2s;
  }
  .tabbar button svg{width:21px; height:21px;}
  .tabbar button.on{color:var(--gold2);}

  /* ── Typo écrans ── */
  .kicker{
    color:var(--gold); font-size:10px; letter-spacing:.34em; text-transform:uppercase;
    font-weight:500; margin:0 0 8px;
  }
  h1.t{font-family:var(--serif); font-size:34px; font-weight:600; line-height:1.04; margin:0 0 6px;}
  h1.t em{font-style:italic; color:var(--gold2); font-weight:500;}
  .lead{color:var(--muted); font-size:13px; line-height:1.55; margin:0 0 22px;}
  h2.sec{
    font-family:var(--serif); font-size:20px; font-weight:600; margin:26px 0 12px;
    display:flex; align-items:baseline; gap:10px;
  }
  h2.sec::after{content:''; flex:1; height:1px; background:var(--line);}
  h2.sec small{color:var(--muted); font-family:var(--sans); font-size:11px; font-weight:400; letter-spacing:.05em;}

  /* ── Composants ── */
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,0)), var(--surface);
    border:1px solid var(--line); border-radius:20px; padding:17px; margin-bottom:12px;
  }
  .row{display:flex; align-items:center; gap:14px;}
  .grow{flex:1; min-width:0;}
  .tap{cursor:pointer; transition:border-color .2s, transform .15s;}
  .tap:active{transform:scale(.985);}
  .tap:hover{border-color:var(--line2);}

  .ava{
    width:56px; height:56px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:21px; font-weight:600; color:var(--gold2);
    background:radial-gradient(circle at 32% 28%, #26242274, #121110) var(--surface2);
    border:1px solid var(--line2); position:relative;
  }
  .ava.lg{width:86px; height:86px; font-size:32px;}

  .bname{font-weight:500; font-size:15.5px; letter-spacing:.01em;}
  .btags{color:var(--muted); font-size:11.5px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:3px 0 8px;}

  .status{display:inline-flex; align-items:center; gap:7px; font-size:11px; color:#CFCCC4; letter-spacing:.04em;}
  .status .dot{width:6px; height:6px; border-radius:50%; box-shadow:0 0 8px 1px currentColor;}
  .rate{font-size:12px; color:var(--gold); letter-spacing:.05em; white-space:nowrap;}
  .chev{color:#56534E; font-size:20px; font-family:var(--serif);}

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font-family:var(--sans); background:var(--surface); border:1px solid var(--line);
    color:#CFCCC4; border-radius:999px; padding:9px 15px; font-size:12px; font-weight:400;
    letter-spacing:.03em; cursor:pointer; transition:all .2s;
  }
  .chip .p{color:var(--gold); margin-left:5px;}
  .chip.on{background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:600;}
  .chip.on .p{color:var(--ink);}
  .chip.mini{padding:7px 13px; font-size:11px;}

  .slot{
    display:flex; align-items:center; gap:13px; background:var(--surface);
    border:1px solid var(--line); border-radius:16px; padding:13px 16px; margin-bottom:8px;
    cursor:pointer; transition:border-color .2s;
  }
  .slot:hover{border-color:var(--line2);}
  .slot .t{font-family:var(--serif); font-size:19px; font-weight:600; width:58px; color:var(--gold2);}
  .slot .who{font-size:12px; color:#CFCCC4;}
  .slot .rule{color:var(--orange); font-size:10.5px; letter-spacing:.03em; margin-top:2px;}
  .price{margin-left:auto; font-family:var(--serif); font-size:17px; font-weight:700; color:var(--gold); white-space:nowrap;}

  .btn{
    display:block; width:100%; border:none; cursor:pointer; margin-top:16px;
    background:linear-gradient(135deg, var(--gold2), var(--gold) 55%, #A8884E);
    color:var(--ink); border-radius:16px; padding:15px;
    font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    box-shadow:0 10px 26px rgba(200,169,106,.22);
  }
  .btn.ghost{background:transparent; border:1px solid var(--line2); color:var(--gold); box-shadow:none;}
  .back{
    background:none; border:none; color:var(--muted); font-family:var(--sans); font-size:12px;
    letter-spacing:.1em; text-transform:uppercase; cursor:pointer; padding:0; margin-bottom:18px;
  }
  .back:hover{color:var(--gold);}

  .photos{display:flex; gap:9px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;}
  .photos::-webkit-scrollbar{display:none;}
  .photo{
    width:106px; height:128px; border-radius:14px; flex-shrink:0; position:relative;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .photo svg{width:30px; height:30px; color:rgba(200,169,106,.4);}
  .photo small{
    position:absolute; bottom:0; left:0; right:0; padding:6px 0;
    background:linear-gradient(transparent, rgba(0,0,0,.72)); color:#D8D5CE;
    font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; text-align:center;
  }

  .stats{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px 4px;}
  .stat{flex:1; text-align:center; border-left:1px solid var(--line);}
  .stat:first-child{border-left:none;}
  .stat .v{font-family:var(--serif); color:var(--gold2); font-weight:700; font-size:19px;}
  .stat .l{color:var(--muted); font-size:9px; letter-spacing:.16em; text-transform:uppercase; margin-top:5px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .pcard{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:11px; display:flex; flex-direction:column;}
  .pimg{
    height:108px; border-radius:12px; margin-bottom:11px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .pimg svg{width:30px; height:30px; color:rgba(200,169,106,.45);}
  .pname{font-size:12.5px; font-weight:500; margin-bottom:3px; line-height:1.3;}
  .pstock{color:var(--muted); font-size:10.5px; letter-spacing:.04em; margin-top:2px;}
  .pprice{font-family:var(--serif); font-size:16px; font-weight:700; color:var(--gold);}
  .add{
    margin-top:10px; background:transparent; border:1px solid var(--line2); color:var(--gold);
    border-radius:10px; padding:8px; font-family:var(--sans); font-size:10px; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; cursor:pointer;
  }
  .add:hover{background:rgba(200,169,106,.08);}

  .kpis{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .kpi{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px;}
  .kpi .v{font-family:var(--serif); color:var(--gold2); font-size:23px; font-weight:700; line-height:1.1;}
  .kpi .l{color:var(--muted); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; margin-top:7px;}

  table{width:100%; border-collapse:collapse; font-size:12px;}
  th{text-align:left; color:var(--muted); padding:4px 6px 10px; font-size:9.5px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;}
  td{padding:11px 6px; border-top:1px solid var(--line); font-weight:300;}
  td b{font-weight:500;}
  .gold{color:var(--gold);}

  .switchrow{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:15px 17px; margin-bottom:10px; font-size:13.5px;
  }
  .sw{width:46px; height:26px; border-radius:999px; background:#2A2A2E; position:relative; cursor:pointer; border:1px solid var(--line); flex-shrink:0; transition:background .2s;}
  .sw::after{content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#8E8B86; transition:all .2s;}
  .sw.on{background:rgba(200,169,106,.25); border-color:var(--line2);}
  .sw.on::after{left:23px; background:var(--gold);}

  .opt{
    display:flex; align-items:center; gap:13px; width:100%; background:var(--surface);
    border:1px solid var(--line); color:var(--text); border-radius:16px; padding:15px 17px;
    margin-bottom:9px; font-family:var(--sans); font-size:13.5px; font-weight:300;
    cursor:pointer; text-align:left; transition:border-color .2s;
  }
  .opt.on{border-color:var(--line2); background:linear-gradient(90deg, rgba(200,169,106,.07), transparent 60%), var(--surface);}
  .opt .check{margin-left:auto; color:var(--gold); font-size:11px; letter-spacing:.1em; text-transform:uppercase;}

  .review{border-top:1px solid var(--line); padding:13px 0;}
  .review:first-child{border-top:none; padding-top:2px;}
  .review .who{font-weight:500; font-size:13px;}
  .review .txt{color:#A5A29B; font-size:12.5px; line-height:1.55; margin-top:4px; font-style:italic; font-family:var(--serif); font-size:14.5px;}

  .tip{
    border-left:2px solid var(--gold); background:linear-gradient(90deg, rgba(200,169,106,.07), transparent);
    color:#BBB6AA; font-size:12px; line-height:1.55; padding:11px 14px; margin:0 0 18px;
    border-radius:0 12px 12px 0;
  }
  .tip b{color:var(--gold2); font-weight:500;}

  .hero{
    border:1px solid var(--line2); border-radius:22px; padding:24px 20px; margin-bottom:6px;
    background:
      radial-gradient(340px 160px at 85% -20%, rgba(200,169,106,.16), transparent 70%),
      linear-gradient(160deg, #16151285, transparent), var(--surface);
  }
  .hero .q{font-family:var(--serif); font-size:23px; font-style:italic; font-weight:500; line-height:1.25; margin:0 0 6px;}
  .hero .s{color:var(--muted); font-size:12px; letter-spacing:.06em;}

  #toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(16px);
    background:#17161A; border:1px solid var(--line2); color:var(--text);
    padding:13px 20px; border-radius:14px; font-size:12.5px; letter-spacing:.02em;
    opacity:0; transition:all .3s; pointer-events:none; max-width:88vw; z-index:99;
    box-shadow:0 16px 40px rgba(0,0,0,.6);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .empty{color:var(--muted); font-size:12.5px; text-align:center; padding:28px 12px; line-height:1.6;}
  .divider{height:1px; background:var(--line); margin:14px 0;}
</style>
</head>

/* ───────── Tarification dynamique (PRD §4) ───────── */
function computePrice(base, slotDate, now){
  let price = base; const rules = [];
  const h = slotDate.getHours();
  if (h >= 22)      { price = base + 2500; rules.push('Tarif nuit · après 22h'); }
  else if (h >= 20) { price = base + 1000; rules.push('Tarif soirée · après 20h'); }
  const d = slotDate.getDay();
  if (d === 0 || d === 6) { price = Math.round(price * 1.15); rules.push('Week-end +15 %'); }
  if ((slotDate - now) / 60000 < 120 && slotDate > now) { price = Math.round(price * 1.20); rules.push('Urgence +20 %'); }
  return {price, rules};
}
const fmt = c => (c/100).toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:2}) + ' €';

function startBooking(id){ state.booking = {service:null, barber:id, slot:null, done:null}; state.tab='book'; state.view=null; render(); }

function genSlots(service){
  const now = new Date(); const out = [];
  for (let h=9; h<=22; h++) for (let m of [0,30]){
    if (h===22 && m===30) continue;
    const d = new Date(); d.setHours(h,m,0,0);
    if (d < now) continue;
    const list = state.booking.barber==='any' ? barbers : barbers.filter(b=>b.id===state.booking.barber);
    const idx = h*2 + m/30;
    const b = list[idx % list.length];
    if ((idx + b.id.length) % 3 === 0) continue;
    const q = computePrice(service.price, d, now);
    out.push({time:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`, date:d, barber:b, ...q});
  }
  return out.slice(0, 14);
}

function confirmSlot(i){
  const s = services.find(x=>x.id===state.booking.service);
  const sl = genSlots(s)[i];
  state.booking.done = {serv:s.name, time:sl.time, barber:sl.barber.name, price:sl.price, rules:sl.rules};

  state.upcoming.push({serv:s.name, time:sl.time, barber:sl.barber.name, price:sl.price});
  toast(`Réservation confirmée — ${sl.time} avec ${sl.barber.name.split(' ')[0]} · ${fmt(sl.price)}`);
  render();
}

  <p class="lead">Catalogue et stocks de la boutique intégrée.</p>
  <div class="card"><table>
    <tr><th>Produit</th><th style="text-align:right">Prix</th><th style="text-align:right">Stock</th></tr>
    ${products.map(p=>`<tr><td>${p.name}</td><td class="gold" style="text-align:right;font-family:var(--serif);font-weight:700;font-size:14px">${fmt(p.price)}</td>
      <td style="text-align:right;color:${p.stock<10?'var(--red)':'var(--muted)'}">${p.stock}</td></tr>`).join('')}
  </table></div>`;
}

/* ───────── Rendu ───────── */
const VIEWS = {home:vHome, book:vBook, cuts:vCuts, shop:vShop, me:vMe,
               planning:vPlanning, status:vStatus, bstats:vBStats,
               dash:vDash, pricing:vPricing, reviews:vReviews, stock:vStock};

function render(){
  $('roles').innerHTML = [['client','Client'],['barber','Barber'],['admin','Admin']]
    .map(([r,l])=>`<button class="${state.role===r?'on':''}" onclick="setRole('${r}')">${l}</button>`).join('');
  $('tabbar').innerHTML = TABS[state.role]
    .map(([k,ic,l])=>`<button class="${state.tab===k?'on':''}" onclick="setTab('${k}')">${ic}${l}</button>`).join('');
  const screen = $('screen');
  screen.innerHTML = '<div class="fade">' +
    ((state.view && state.view.type==='barber') ? vBarberProfile(state.view.id) : VIEWS[state.tab]()) +
    '</div>';
  screen.scrollTop = 0;
}
render();
</script>
</body>
</html>
